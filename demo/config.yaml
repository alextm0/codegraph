# Demo config for psf/requests v2.31.0
# Usage:
#   codegraph --config demo/config.yaml rebuild
#   codegraph --config demo/config.yaml query "how does session cookie handling work"
#   codegraph --config demo/config.yaml visualize

project_root: "requests/requests"

exclude_patterns:
  - "__pycache__"
  - ".venv"
  - ".git"
  - "*.pyc"
  - ".pytest_cache"
  - "tests"
  - "docs"

neo4j:
  uri: "neo4j://localhost:7687"
  username: "neo4j"

ppr:
  damping_factor: 0.70
  max_iterations: 20
  tolerance: 1.0e-7
  top_k: 30
  retrieval_mode: "uniform"

graph:
  create_colocation_edges: false

retrieval:
  expand_neighbors: false
  inject_directory_files: false

seed_selection:
  entity_match_weight: 0.6
  bm25_weight: 0.3
  current_file_weight: 0.1
  bm25_top_n: 10
  exclude_seed_paths: []

mcp:
  server_name: "codegraph"
  default_token_budget: 6000
  default_top_k: 15
