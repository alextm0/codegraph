project_root: /Users/alexandrutoma/dev/codegraph
exclude_patterns:
- __pycache__
- .venv
- .git
- '*.pyc'
- .pytest_cache
- tests/fixtures/
neo4j:
  uri: neo4j://localhost:7687
  username: neo4j
ppr:
  damping_factor: 0.7
  max_iterations: 20
  tolerance: 1.0e-07
  top_k: 30
  retrieval_mode: uniform
seed_selection:
  entity_match_weight: 0.6
  bm25_weight: 0.3
  bm25_top_n: 10
  exclude_seed_paths:
  - tests/
  - test_
mcp:
  server_name: codegraph
  default_token_budget: 6000
  default_top_k: 30
